<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart NLP Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="light">
    <div class="chat-wrapper">
        <div class="top-bar">
            <h2>Smart NLP Chatbot</h2>
            <div class="controls">
                <button onclick="toggleVoice()"><i class="fas fa-microphone"></i></button>
                <button onclick="toggleVoiceOutput()"><i class="fas fa-volume-up"></i></button>
                <button onclick="clearChat()"><i class="fas fa-trash"></i></button>
                <button onclick="toggleHistory()"><i class="fas fa-history"></i></button>
                <button onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
            </div>
        </div>

        <div id="status">Idle</div>

        <div id="quick-replies"></div>

        <div class="robot-container">
            <div class="robot" id="robot">
                <div class="robot-head">
                    <div class="robot-eye left"></div>
                    <div class="robot-eye right"></div>
                    <div class="robot-mouth"></div>
                </div>
                <div class="robot-body"></div>
            </div>
        </div>

        <div id="typing" style="display: none;">Bot is typing...</div>

        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div id="history-panel" class="history-panel">
        <div class="history-header">
            <h3>Chat History</h3>
            <button onclick="toggleHistory()" class="close-history"><i class="fas fa-times"></i></button>
        </div>
        <div id="history-content" class="history-content"></div>
        <div class="history-footer">
            <button onclick="clearAllHistory()" class="clear-history-btn">Clear All History</button>
        </div>
    </div>

    <div id="toast">Message copied!</div>

    <script src="/static/script.js"></script>
</body>
</html>
